      .check { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 50%; background: #66d9e81a; color: #82dce8; font-size: 24px; }
      h1 { font-size: clamp(28px, 6vw, 36px); letter-spacing: -.04em; }
      p { color: #acbed3; line-height: 1.8; }
      a { display: inline-flex; margin-top: 16px; min-height: 48px; align-items: center; padding: 12px 20px; border-radius: 10px; background: #8bd5e0; color: #071729; text-decoration: none; font-weight: 600; }
      a:focus-visible { outline: 2px solid #edf2ff; outline-offset: 5px; }

  <body><main><span class="check" aria-hidden="true">✓</span><h1>Thanks for reaching out.</h1><p>Your message has been submitted. I’ll reply to the email address you provided as soon as I can.</p><a href="/#contact">Back to portfolio</a></main></body>
